name: Build ROBLOX 2016

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Check compiler
        shell: cmd
        run: |
          where cl
          cl

      - name: Bootstrap Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          call bootstrap.bat msvc

      - name: Check Boost.Build
        shell: cmd
        working-directory: Library\boost
        run: |
          if not exist b2.exe (
            echo b2.exe was not created
            dir
            exit /b 1
          )

          b2.exe --version

      - name: Build Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          b2.exe ^
            -j2 ^
            toolset=msvc ^
            variant=release ^
            link=static ^
            runtime-link=static ^
            address-model=32 ^
            architecture=x86 ^
            stage

      - name: Verify Boost
        shell: pwsh
        run: |
          $boost = Join-Path $env:GITHUB_WORKSPACE "Library\boost\stage\lib"

          if (-not (Test-Path $boost)) {
            throw "Boost stage directory was not created."
          }

          Write-Host "Boost libraries:"
          Get-ChildItem $boost

      - name: Patch old Visual Studio projects
        shell: pwsh
        run: |
          Write-Host "Patching v140_xp -> v143"

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.vcxproj `
            -Recurse `
            -File |
            ForEach-Object {

              $file = $_.FullName
              $text = Get-Content $file -Raw

              if ($text.Contains("v140_xp")) {
                $text = $text.Replace("v140_xp", "v143")
                Set-Content -Path $file -Value $text -NoNewline

                Write-Host "Patched: $file"
              }
            }

      - name: Build Roblox solution
        shell: cmd
        run: |
          msbuild Roblox.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:PlatformToolset=v143 ^
            /verbosity:minimal

      - name: Find executables
        shell: pwsh
        run: |
          Write-Host "========== EXECUTABLES =========="

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $files) {
            throw "No EXE files were produced."
          }

          $files |
            Select-Object FullName, Length

      - name: Package build
        shell: pwsh
        run: |
          $artifact = "$env:GITHUB_WORKSPACE\artifact"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifact | Out-Null

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $files) {
            Copy-Item `
              $file.FullName `
              "$artifact\$($file.Name)" `
              -Force
          }

          Write-Host "========== BUILD ARTIFACT =========="

          Get-ChildItem $artifact |
            Select-Object Name, Length

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ROBLOX2016-Windows
          path: artifact
          if-no-files-found: error
