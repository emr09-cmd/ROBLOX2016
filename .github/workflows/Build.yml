name: Build ROBLOX2016

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Verify compiler
        shell: cmd
        run: |
          where cl
          cl

      - name: Check Boost version
        shell: pwsh
        run: |
          $versionFile = Join-Path $env:GITHUB_WORKSPACE "Library\boost\boost\version.hpp"

          if (-not (Test-Path $versionFile)) {
            throw "Boost version.hpp was not found."
          }

          $text = Get-Content $versionFile -Raw
          Write-Host $text

          if ($text -notmatch "BOOST_VERSION 107400") {
            throw "This workflow expects Boost 1.74.0."
          }

          Write-Host "Boost 1.74.0 confirmed."

      - name: Repair missing Boost files
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $boost = Join-Path $root "Library\boost"

          $requiredThreadFile = Join-Path `
            $boost `
            "libs\thread\src\win32\thread.cpp"

          if (Test-Path $requiredThreadFile) {
            Write-Host "Boost.Thread source files are already present."
            exit 0
          }

          Write-Host "Boost source tree is incomplete."
          Write-Host "Missing:"
          Write-Host $requiredThreadFile

          $temp = Join-Path `
            $env:RUNNER_TEMP `
            "boost-1.74.0"

          if (Test-Path $temp) {
            Remove-Item $temp -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $temp `
            -Force | Out-Null

          $zip = Join-Path `
            $temp `
            "boost_1_74_0.zip"

          Write-Host "Downloading official Boost 1.74.0 source..."

          Invoke-WebRequest `
            -Uri "https://archives.boost.io/release/1.74.0/source/boost_1_74_0.zip" `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            throw "Boost archive download failed."
          }

          Write-Host "Extracting Boost 1.74.0..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $temp `
            -Force

          $official = Join-Path `
            $temp `
            "boost_1_74_0"

          if (-not (Test-Path $official)) {
            throw "Extracted Boost 1.74.0 directory was not found."
          }

          # Restore missing Boost.Build files.
          $officialBuild = Join-Path `
            $official `
            "tools\build"

          $localBuild = Join-Path `
            $boost `
            "tools\build"

          $buildSystem = Join-Path `
            $localBuild `
            "src\build-system.jam"

          if (-not (Test-Path $buildSystem)) {
            Write-Host "Restoring missing Boost.Build files..."

            if (Test-Path $localBuild) {
              Remove-Item `
                $localBuild `
                -Recurse `
                -Force
            }

            Copy-Item `
              -Path $officialBuild `
              -Destination $localBuild `
              -Recurse `
              -Force
          }

          # Restore any missing files from Boost's official 1.74 source.
          $officialLibs = Join-Path `
            $official `
            "libs"

          $localLibs = Join-Path `
            $boost `
            "libs"

          Write-Host "Checking for missing Boost library files..."

          $copied = 0

          Get-ChildItem `
            -Path $officialLibs `
            -Recurse `
            -File |
          ForEach-Object {

            $relative = $_.FullName.Substring(
              $officialLibs.Length
            ).TrimStart('\')

            $destination = Join-Path `
              $localLibs `
              $relative

            if (-not (Test-Path $destination)) {

              $destinationDirectory = Split-Path `
                $destination `
                -Parent

              if (-not (Test-Path $destinationDirectory)) {
                New-Item `
                  -ItemType Directory `
                  -Path $destinationDirectory `
                  -Force | Out-Null
              }

              Copy-Item `
                -Path $_.FullName `
                -Destination $destination `
                -Force

              $copied++
            }
          }

          Write-Host "Missing Boost files restored: $copied"

          $checks = @(
            "tools\build\src\build-system.jam",
            "libs\thread\src\win32\thread.cpp",
            "libs\thread\src\win32\tss_dll.cpp",
            "libs\thread\src\win32\tss_pe.cpp",
            "libs\thread\src\win32\thread_primitives.cpp",
            "libs\thread\src\future.cpp"
          )

          Write-Host "Verifying required Boost.Thread files..."

          foreach ($relative in $checks) {

            $path = Join-Path `
              $boost `
              $relative

            if (-not (Test-Path $path)) {
              throw "Required Boost file is still missing: $relative"
            }

            Write-Host "OK: $relative"
          }

      - name: Configure Boost for GitHub Actions MSVC
        shell: cmd
        working-directory: Library\boost
        run: |
          echo Removing stale Boost.Build configuration...

          if exist project-config.jam del /q project-config.jam
          if exist user-config.jam del /q user-config.jam

          echo Removing stale Boost build state...

          if exist bin.v2 rmdir /s /q bin.v2

          echo Bootstrapping Boost...

          call bootstrap.bat msvc

          if not exist b2.exe (
            echo ERROR: b2.exe was not created.
            exit /b 1
          )

          echo.
          echo Creating explicit project-config.jam...

          > project-config.jam echo import option ;
          >> project-config.jam echo using msvc : 14.2 : cl.exe ;
          >> project-config.jam echo option.set keep-going : false ;

          echo.
          echo project-config.jam:
          type project-config.jam

          echo.
          echo Compiler:
          where cl
          cl

          echo.
          echo B2:
          b2.exe --version

      - name: Verify Boost compiler configuration
        shell: cmd
        working-directory: Library\boost
        run: |
          echo ===== Boost configuration =====
          type project-config.jam

          echo.
          echo ===== Running B2 configuration diagnostics =====

          .\b2.exe ^
            --debug-configuration ^
            --toolset=msvc-14.2 ^
            --version

      - name: Build Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          set "BOOST_BUILD_PATH=%GITHUB_WORKSPACE%\Library\boost\tools\build"

          echo BOOST_BUILD_PATH=%BOOST_BUILD_PATH%
          echo GITHUB_WORKSPACE=%GITHUB_WORKSPACE%

          if not exist "%BOOST_BUILD_PATH%\src\build-system.jam" (
            echo ERROR: build-system.jam is missing.
            exit /b 1
          )

          if not exist "libs\thread\src\win32\thread.cpp" (
            echo ERROR: Boost.Thread thread.cpp is missing.
            exit /b 1
          )

          echo.
          echo Starting Boost build...
          echo.

          .\b2.exe stage ^
            -a ^
            --reconfigure ^
            --toolset=msvc-14.2 ^
            --variant=release ^
            address-model=32 ^
            architecture=x86 ^
            "-sZLIB_SOURCE=%GITHUB_WORKSPACE%\Library\zlib\include\zlib" ^
            "-sZLIB_BINARY=%GITHUB_WORKSPACE%\Library\zlib\lib\release" ^
            "--prefix=%GITHUB_WORKSPACE%\Library\boost" ^
            "--libdir=%GITHUB_WORKSPACE%\Library\boost\lib" ^
            "--includedir=%GITHUB_WORKSPACE%\Library\boost\include"

          if errorlevel 1 (
            echo.
            echo ERROR: Boost build failed.
            exit /b 1
          )

      - name: Fix hard-coded Roblox paths
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $file = Join-Path $root "Library\boost\build_boost.bat"

          if (Test-Path $file) {
            $text = Get-Content $file -Raw

            $text = $text.Replace(
              "D:\Roblox\Source",
              $root
            )

            Set-Content `
              -Path $file `
              -Value $text `
              -NoNewline
          }

      - name: Verify solution
        shell: pwsh
        run: |
          if (-not (Test-Path "Roblox.sln")) {
            throw "Roblox.sln was not found."
          }

          Write-Host "Roblox.sln found."

      - name: Build Roblox solution
        shell: cmd
        run: |
          msbuild Roblox.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:PreferredToolArchitecture=x86 ^
            /verbosity:minimal

      - name: Find build outputs
        if: success()
        shell: pwsh
        run: |
          Write-Host "Searching for executables and DLLs..."

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Include *.exe,*.dll `
            -ErrorAction SilentlyContinue

          if ($files.Count -eq 0) {
            Write-Host "No .exe or .dll files found."
          }
          else {
            $files |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ROBLOX2016-Windows
          path: |
            **/*.exe
            **/*.dll
          if-no-files-found: warn
