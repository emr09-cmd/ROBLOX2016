name: Build ROBLOX2016

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # Visual Studio / MSBuild
      # ============================================================

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Verify compiler
        shell: cmd
        run: |
          where cl
          cl

      # ============================================================
      # Boost
      # ============================================================

      - name: Check Boost source
        shell: pwsh
        run: |
          $boost = Join-Path $env:GITHUB_WORKSPACE "Library\boost"

          Write-Host "Boost directory:"
          Write-Host $boost

          if (-not (Test-Path $boost)) {
            throw "Library\boost does not exist."
          }

          Write-Host ""
          Write-Host "Checking Boost.Build..."

          $buildSystem = Join-Path $boost "tools\build\src\build-system.jam"

          if (Test-Path $buildSystem) {
            Write-Host "build-system.jam already exists."
          }
          else {
            Write-Host "build-system.jam is missing."
            Write-Host "The repository Boost.Build tree is incomplete."
          }

      - name: Download Boost.Build 1.74
        shell: pwsh
        run: |
          $boost = Join-Path $env:GITHUB_WORKSPACE "Library\boost"
          $buildSrc = Join-Path $boost "tools\build\src"

          $buildSystem = Join-Path $buildSrc "build-system.jam"

          if (Test-Path $buildSystem) {
            Write-Host "Boost.Build is already complete."
            exit 0
          }

          Write-Host "Downloading Boost 1.74.0 Boost.Build source..."

          $temp = Join-Path $env:RUNNER_TEMP "boost-build-1.74"

          if (Test-Path $temp) {
            Remove-Item $temp -Recurse -Force
          }

          New-Item -ItemType Directory -Path $temp | Out-Null

          $zip = Join-Path $temp "boost_1_74_0.zip"

          Invoke-WebRequest `
            -Uri "https://archives.boost.io/release/1.74.0/source/boost_1_74_0.zip" `
            -OutFile $zip

          Write-Host "Extracting Boost 1.74.0..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $temp `
            -Force

          $source = Join-Path $temp "boost_1_74_0\tools\build"

          if (-not (Test-Path $source)) {
            throw "Downloaded Boost.Build source was not found."
          }

          Write-Host "Replacing incomplete tools\build..."

          $destination = Join-Path $boost "tools\build"

          if (Test-Path $destination) {
            Remove-Item $destination -Recurse -Force
          }

          Copy-Item `
            -Path $source `
            -Destination $destination `
            -Recurse `
            -Force

          $buildSystem = Join-Path `
            $destination `
            "src\build-system.jam"

          if (-not (Test-Path $buildSystem)) {
            throw "build-system.jam is still missing after replacement."
          }

          Write-Host ""
          Write-Host "Boost.Build fixed successfully:"
          Write-Host $buildSystem

      - name: Verify Boost.Build
        shell: pwsh
        run: |
          $boost = Join-Path $env:GITHUB_WORKSPACE "Library\boost"

          $required = @(
            "tools\build\src\build-system.jam",
            "tools\build\src\kernel\bootstrap.jam",
            "tools\build\src\kernel\modules.jam",
            "tools\build\boost-build.jam"
          )

          foreach ($file in $required) {
            $path = Join-Path $boost $file

            if (-not (Test-Path $path)) {
              throw "Missing Boost.Build file: $path"
            }

            Write-Host "OK: $file"
          }

      - name: Bootstrap Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          if exist b2.exe del /q b2.exe

          call bootstrap.bat msvc

          if not exist b2.exe (
            echo ERROR: b2.exe was not created.
            dir /a
            exit /b 1
          )

          echo.
          echo b2.exe created successfully.
          dir b2.exe

      - name: Build Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          set "BOOST_BUILD_PATH=%GITHUB_WORKSPACE%\Library\boost\tools\build"

          echo BOOST_BUILD_PATH=%BOOST_BUILD_PATH%
          echo GITHUB_WORKSPACE=%GITHUB_WORKSPACE%
          echo.

          if not exist "%BOOST_BUILD_PATH%\src\build-system.jam" (
            echo ERROR: build-system.jam is missing.
            exit /b 1
          )

          .\b2.exe stage ^
            -a ^
            --reconfigure ^
            --toolset=msvc ^
            --variant=release ^
            address-model=32 ^
            architecture=x86 ^
            "-sZLIB_SOURCE=%GITHUB_WORKSPACE%\Library\zlib\include\zlib" ^
            "-sZLIB_BINARY=%GITHUB_WORKSPACE%\Library\zlib\lib\release" ^
            "--prefix=%GITHUB_WORKSPACE%\Library\boost" ^
            "--libdir=%GITHUB_WORKSPACE%\Library\boost\lib" ^
            "--includedir=%GITHUB_WORKSPACE%\Library\boost\include"

      # ============================================================
      # Fix repository-specific paths
      # ============================================================

      - name: Fix hard-coded Roblox paths
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE

          $file = Join-Path `
            $root `
            "Library\boost\build_boost.bat"

          if (Test-Path $file) {
            Write-Host "Patching $file"

            $text = Get-Content $file -Raw

            $text = $text.Replace(
              "D:\Roblox\Source",
              $root
            )

            Set-Content `
              -Path $file `
              -Value $text `
              -NoNewline
          }

      # ============================================================
      # Build Roblox
      # ============================================================

      - name: Verify solution
        shell: pwsh
        run: |
          if (-not (Test-Path "Roblox.sln")) {
            throw "Roblox.sln was not found."
          }

          Write-Host "Roblox.sln found."

      - name: Build Roblox solution
        shell: cmd
        run: |
          msbuild Roblox.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:PreferredToolArchitecture=x86 ^
            /verbosity:minimal

      # ============================================================
      # Find outputs
      # ============================================================

      - name: Find build outputs
        if: success()
        shell: pwsh
        run: |
          Write-Host "Searching for executables and DLLs..."

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Include *.exe,*.dll `
            -ErrorAction SilentlyContinue

          if ($files.Count -eq 0) {
            Write-Host "No .exe or .dll files found."
          }
          else {
            $files |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }

      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ROBLOX2016-Windows
          path: |
            **/*.exe
            **/*.dll
          if-no-files-found: warn
