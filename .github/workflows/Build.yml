name: Build ROBLOX 2016

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Check compiler
        shell: cmd
        run: |
          where cl
          cl

      - name: Inspect Boost scripts
        shell: pwsh
        run: |
          Write-Host "Boost directory:"
          Get-ChildItem "$env:GITHUB_WORKSPACE\Library\boost" |
            Select-Object Name, Length

          Write-Host ""
          Write-Host "Build Boost script:"
          Get-Content "$env:GITHUB_WORKSPACE\Library\boost\build_boost.bat"

      - name: Build Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          call build_boost.bat

      - name: Check Boost output
        shell: pwsh
        run: |
          Write-Host "Searching for Boost libraries..."

          $libs = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\Library\boost" `
            -Filter *.lib `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $libs) {
            Write-Host "No Boost libraries found."
            Write-Host ""
            Write-Host "Boost directory contents:"
            Get-ChildItem `
              "$env:GITHUB_WORKSPACE\Library\boost" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName
          }
          else {
            $libs | Select-Object FullName, Length
          }

      - name: Patch Visual Studio toolset
        shell: pwsh
        run: |
          Write-Host "Changing v140_xp to v143..."

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.vcxproj `
            -Recurse `
            -File |
            ForEach-Object {

              $file = $_.FullName
              $text = Get-Content $file -Raw

              if ($text.Contains("v140_xp")) {
                $text = $text.Replace("v140_xp", "v143")
                Set-Content `
                  -Path $file `
                  -Value $text `
                  -NoNewline

                Write-Host "Patched: $file"
              }
            }

      - name: Build Roblox
        shell: cmd
        run: |
          msbuild Roblox.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:PlatformToolset=v143 ^
            /verbosity:minimal

      - name: Find executables
        shell: pwsh
        run: |
          Write-Host "========== EXE FILES =========="

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $files) {
            throw "No executable files were produced."
          }

          $files |
            Select-Object FullName, Length

      - name: Package executables
        shell: pwsh
        run: |
          $artifact = "$env:GITHUB_WORKSPACE\artifact"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifact | Out-Null

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $files) {
            Copy-Item `
              $file.FullName `
              "$artifact\$($file.Name)" `
              -Force
          }

          Get-ChildItem $artifact |
            Select-Object Name, Length

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ROBLOX2016-Windows
          path: artifact
          if-no-files-found: error
