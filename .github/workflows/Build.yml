name: Build ROBLOX2016

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Verify compiler
        shell: cmd
        run: |
          where cl
          cl

      # ------------------------------------------------------------
      # Boost
      # ------------------------------------------------------------

      - name: Bootstrap Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          call bootstrap.bat msvc

          if not exist b2.exe (
            echo ERROR: b2.exe was not created.
            dir /a
            exit /b 1
          )

          echo.
          echo Boost b2.exe created successfully.
          dir b2.exe

      - name: Locate Boost.Build files
        shell: pwsh
        working-directory: Library\boost
        run: |
          Write-Host "Searching for build-system.jam..."
          $files = Get-ChildItem -Path . -Filter "build-system.jam" -Recurse -File

          if ($files.Count -eq 0) {
            Write-Host "ERROR: build-system.jam was not found."
          }
          else {
            $files | Select-Object -ExpandProperty FullName
          }

          Write-Host ""
          Write-Host "Boost.Build directory:"
          if (Test-Path ".\tools\build") {
            Get-ChildItem ".\tools\build" -Force
          }
          else {
            Write-Host "ERROR: tools\build does not exist."
          }

          Write-Host ""
          Write-Host "Boost root:"
          Get-ChildItem "." -Force

      - name: Build Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          set "BOOST_BUILD_PATH=%GITHUB_WORKSPACE%\Library\boost\tools\build"

          echo BOOST_BUILD_PATH=%BOOST_BUILD_PATH%
          echo GITHUB_WORKSPACE=%GITHUB_WORKSPACE%
          echo.

          if not exist "%BOOST_BUILD_PATH%" (
            echo ERROR: Boost.Build directory does not exist:
            echo %BOOST_BUILD_PATH%
            exit /b 1
          )

          .\b2.exe stage ^
            -a ^
            --reconfigure ^
            --toolset=msvc ^
            --variant=release ^
            address-model=32 ^
            architecture=x86 ^
            "-sZLIB_SOURCE=%GITHUB_WORKSPACE%\Library\zlib\include\zlib" ^
            "-sZLIB_BINARY=%GITHUB_WORKSPACE%\Library\zlib\lib\release" ^
            "--prefix=%GITHUB_WORKSPACE%\Library\boost" ^
            "--libdir=%GITHUB_WORKSPACE%\Library\boost\lib" ^
            "--includedir=%GITHUB_WORKSPACE%\Library\boost\include"

      # ------------------------------------------------------------
      # Build Roblox
      # ------------------------------------------------------------

      - name: Inspect repository build files
        shell: pwsh
        run: |
          Write-Host "Solution:"
          Get-Item ".\Roblox.sln"

          Write-Host ""
          Write-Host "WindowsClient project:"
          Get-Item ".\WindowsClient.vcxproj"

          Write-Host ""
          Write-Host "Build scripts:"
          Get-ChildItem -Path . -Filter "*.bat" -Recurse -File |
            Select-Object -First 30 -ExpandProperty FullName

      - name: Fix hard-coded Roblox paths
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE

          Write-Host "Workspace: $root"

          # Replace the old developer-machine path used by the repository.
          $files = @(
            "Library\boost\build_boost.bat"
          )

          foreach ($file in $files) {
            $path = Join-Path $root $file

            if (Test-Path $path) {
              Write-Host "Patching $file"

              $text = Get-Content $path -Raw

              $text = $text.Replace(
                "D:\Roblox\Source",
                $root
              )

              Set-Content -Path $path -Value $text -NoNewline
            }
          }

      - name: Build Roblox solution
        shell: cmd
        run: |
          msbuild Roblox.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:PreferredToolArchitecture=x86 ^
            /verbosity:minimal

      # ------------------------------------------------------------
      # Collect build output
      # ------------------------------------------------------------

      - name: Find build outputs
        if: success()
        shell: pwsh
        run: |
          Write-Host "Searching for executables..."

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Include *.exe,*.dll `
            -ErrorAction SilentlyContinue

          if ($files.Count -eq 0) {
            Write-Host "No .exe or .dll files found."
          }
          else {
            $files |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ROBLOX2016-Windows
          path: |
            **/*.exe
            **/*.dll
          if-no-files-found: warn
