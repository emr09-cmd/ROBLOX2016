name: Build ROBLOX 2016

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show MSBuild version
        shell: pwsh
        run: msbuild -version

      - name: Bootstrap Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          call bootstrap.bat

      - name: Build Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          call b2 -j2

      - name: Build Roblox
        shell: cmd
        run: |
          msbuild Roblox.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:PlatformToolset=v143 ^
            /verbosity:minimal

      - name: Find executables
        shell: pwsh
        run: |
          Write-Host "Searching for executables..."

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:GITHUB_WORKSPACE\artifact"

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $files) {
            throw "No executable files were produced."
          }

          foreach ($file in $files) {
            Copy-Item `
              $file.FullName `
              "$env:GITHUB_WORKSPACE\artifact\$($file.Name)" `
              -Force
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ROBLOX2016-build
          path: artifact
          if-no-files-found: error
