name: Build ROBLOX 2016

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Check compiler
        shell: cmd
        run: |
          where cl
          cl

      - name: Bootstrap Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          call bootstrap.bat msvc

      - name: Verify Boost bootstrap
        shell: pwsh
        working-directory: Library\boost
        run: |
          Write-Host "Boost files after bootstrap:"

          Get-ChildItem |
            Select-Object Name, Length

          if (-not (Test-Path ".\b2.exe")) {
            throw "b2.exe was not created by bootstrap."
          }

          Write-Host ""
          Write-Host "b2.exe found."

      - name: Build Boost
        shell: cmd
        working-directory: Library\boost
        run: |
          .\b2.exe stage ^
            -a ^
            --reconfigure ^
            --toolset=msvc ^
            --variant=release ^
            -sZLIB_SOURCE=%GITHUB_WORKSPACE%\Library\zlib\include\zlib ^
            -sZLIB_BINARY=%GITHUB_WORKSPACE%\Library\zlib\lib\release ^
            --prefix=%GITHUB_WORKSPACE%\Library\boost ^
            --libdir=%GITHUB_WORKSPACE%\Library\boost\lib ^
            --includedir=%GITHUB_WORKSPACE%\Library\boost\include

      - name: Verify Boost libraries
        shell: pwsh
        run: |
          $lib = "$env:GITHUB_WORKSPACE\Library\boost\stage\lib"

          Write-Host "Looking for Boost libraries..."

          if (-not (Test-Path $lib)) {
            throw "Boost stage/lib directory was not created."
          }

          Get-ChildItem $lib |
            Select-Object Name, Length

      - name: Patch Visual Studio projects
        shell: pwsh
        run: |
          Write-Host "Patching legacy Visual Studio toolset..."

          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.vcxproj `
            -Recurse `
            -File |
            ForEach-Object {

              $file = $_.FullName
              $text = Get-Content $file -Raw

              if ($text.Contains("v140_xp")) {
                $text = $text.Replace("v140_xp", "v143")

                Set-Content `
                  -Path $file `
                  -Value $text `
                  -NoNewline

                Write-Host "Patched: $file"
              }
            }

      - name: Patch old Boost toolset
        shell: pwsh
        run: |
          Write-Host "Patching msvc-14.0 references..."

          Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\Library\boost" `
            -Filter *.bat `
            -Recurse `
            -File |
            ForEach-Object {

              $file = $_.FullName
              $text = Get-Content $file -Raw

              if ($text.Contains("msvc-14.0")) {
                $text = $text.Replace("msvc-14.0", "msvc")

                Set-Content `
                  -Path $file `
                  -Value $text `
                  -NoNewline

                Write-Host "Patched: $file"
              }
            }

      - name: Build Roblox
        shell: cmd
        run: |
          msbuild Roblox.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=Win32 ^
            /p:PlatformToolset=v143 ^
            /verbosity:minimal

      - name: Find executables
        shell: pwsh
        run: |
          Write-Host "========== EXECUTABLES =========="

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $files) {
            throw "No EXE files were produced."
          }

          $files |
            Select-Object FullName, Length

      - name: Package build
        shell: pwsh
        run: |
          $artifact = "$env:GITHUB_WORKSPACE\artifact"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifact | Out-Null

          $files = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue

          foreach ($file in $files) {
            Copy-Item `
              $file.FullName `
              "$artifact\$($file.Name)" `
              -Force
          }

          Write-Host ""
          Write-Host "========== ARTIFACT =========="

          Get-ChildItem $artifact |
            Select-Object Name, Length

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ROBLOX2016-Windows
          path: artifact
          if-no-files-found: error
